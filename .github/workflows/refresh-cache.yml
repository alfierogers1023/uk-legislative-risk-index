name: Refresh dashboard cache

# Keeps data/raw/ (the pre-baked cache app.py needs for a fast cold start on
# Streamlit Community Cloud's ephemeral filesystem) from going too stale,
# without requiring a manual refresh + push before every time someone might
# view the dashboard. See scripts/refresh_cache.py for what/why.

on:
  schedule:
    - cron: "0 6 * * 1" # every Monday 06:00 UTC
  workflow_dispatch: {} # allows manually triggering a refresh from the Actions tab

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh cache
        run: python3 scripts/refresh_cache.py

      - name: Commit and push if the cache changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/raw/ data/cache_metadata.json
          if git diff --staged --quiet; then
            echo "No cache changes — nothing to commit."
          else
            git commit -m "Scheduled cache refresh"
            git push
          fi
